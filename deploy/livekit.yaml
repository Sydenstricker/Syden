# As chaves vêm da variável LIVEKIT_KEYS (definida no docker-compose a partir do .env).
port: 7880 # sinalização; fica atrás do Caddy e NÃO deve ser aberta no firewall
rtc:
  tcp_port: 7881 # fallback de mídia para redes que bloqueiam UDP
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true # descobre o IP público da VPS via STUN
logging:
  # warn, e não info: cada linha de log custa processador no mesmo lugar que encaminha os pacotes. No
  # teste de carga (06/10/2026), o log detalhado deu 23% de perda onde o warn deu 0,03%.
  level: warn
