
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="w-64 h-64">
        <defs>
          <style>
            /* O anel fecha desenhando: 942 é o perímetro de um raio 150 (2·π·150), e é o número que
               faz o traço caber exatamente numa volta. Errar isso deixa o anel fechando cedo demais. */
            @keyframes fecharAnel {
              from { stroke-dashoffset: 942; }
              to   { stroke-dashoffset: 0; }
            }
            @keyframes chegar {
              0%   { transform: scale(0.6); opacity: 0; }
              45%  { transform: scale(1.05); opacity: 1; }
              70%  { transform: scale(0.98); }
              100% { transform: scale(1); opacity: 1; }
            }
            /* O selo cai DEPOIS do anel fechar. É a ordem que conta a história: conferi, e agora
               carimbo. Os dois ao mesmo tempo viram uma coisa só, e não se lê nenhuma. */
            @keyframes selo {
              0%, 45% { transform: scale(0); opacity: 0; }
              62%     { transform: scale(1.18); opacity: 1; }
              75%     { transform: scale(0.96); }
              100%    { transform: scale(1); opacity: 1; }
            }
            @keyframes riscar {
              0%, 58% { stroke-dashoffset: 78; }
              78%     { stroke-dashoffset: 0; }
              100%    { stroke-dashoffset: 0; }
            }
            /* Uma onda só, saindo do selo. É o "pronto" — e some, porque o que fica é o certo. */
            @keyframes onda {
              0%, 58% { opacity: 0; transform: scale(0.5); }
              70%     { opacity: 0.5; }
              100%    { opacity: 0; transform: scale(1.9); }
            }
            /* As orelhas levantam uma vez, no instante do selo. É o que faz o desenho parecer contente
               em vez de só correto. */
            @keyframes orelhasAcima {
              0%, 50% { transform: rotate(0deg); }
              66%     { transform: rotate(-7deg) translateY(-6px); }
              100%    { transform: rotate(0deg); }
            }

            .bunny-ears-inner { fill: #f48fb1; }

            .anel {
              fill: none;
              stroke: #3ba55d;
              stroke-width: 10;
              stroke-linecap: round;
              stroke-dasharray: 942;
              /* Começa no topo: sem isto o traço nasce na direita, que é onde o SVG começa a desenhar
                 um círculo — e o olho lê como um pedaço faltando, não como algo se fechando. */
              transform: rotate(-90deg);
              transform-origin: 200px 215px;
              animation: fecharAnel 2.80s cubic-bezier(0.3, 0, 0.2, 1) infinite;
            }

            .figura { transform-origin: 200px 240px; animation: chegar 2.80s cubic-bezier(0.34, 1.4, 0.5, 1) infinite; }
            .orelhas { transform-origin: 200px 180px; animation: orelhasAcima 2.80s ease-in-out infinite; }
            .selo { transform-origin: 288px 300px; animation: selo 2.80s cubic-bezier(0.34, 1.5, 0.5, 1) infinite; }
            .onda { transform-origin: 288px 300px; animation: onda 2.80s ease-out infinite; }
            .certo {
              fill: none;
              stroke: #ffffff;
              stroke-width: 9;
              stroke-linecap: round;
              stroke-linejoin: round;
              stroke-dasharray: 78;
              animation: riscar 2.80s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            }
          </style>
        </defs>

        <circle class="anel" cx="200" cy="215" r="150" />

        <g class="figura">
          <g class="orelhas">
            <path d="M 162 180 C 130 90, 170 50, 185 80 C 195 100, 185 150, 175 180 Z" fill="#ffffff" />
            <path d="M 166 170 C 142 100, 170 70, 180 90 C 188 105, 180 145, 173 170 Z" class="bunny-ears-inner" />
            <path d="M 238 180 C 270 90, 230 50, 215 80 C 205 100, 215 150, 225 180 Z" fill="#ffffff" />
            <path d="M 234 170 C 258 100, 230 70, 220 90 C 212 105, 220 145, 227 170 Z" class="bunny-ears-inner" />
          </g>

          <circle cx="200" cy="225" r="72" fill="#ffffff" />

          <!-- Olhos fechados em arco, como na tela de boas-vindas: contentamento, não vigilância. -->
          <path d="M 160 212 Q 172 202 184 212" fill="none" stroke="#1e1e1e" stroke-width="4.5" stroke-linecap="round" />
          <path d="M 216 212 Q 228 202 240 212" fill="none" stroke="#1e1e1e" stroke-width="4.5" stroke-linecap="round" />

          <path d="M 194 228 Q 200 224 206 228 Q 200 236 194 228 Z" fill="#b91c1c" />
          <path d="M 186 240 Q 200 254 214 240" fill="none" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round" />

          <ellipse cx="158" cy="234" rx="12" ry="7" fill="#f48fb1" opacity="0.5" />
          <ellipse cx="242" cy="234" rx="12" ry="7" fill="#f48fb1" opacity="0.5" />
        </g>

        <!-- O selo do "conferido", no canto de baixo, por cima de tudo. -->
        <circle class="onda" cx="288" cy="300" r="42" fill="none" stroke="#3ba55d" stroke-width="8" />
        <g class="selo">
          <circle cx="288" cy="300" r="42" fill="#3ba55d" />
          <path class="certo" d="M 268 300 L 282 314 L 310 286" />
        </g>
      </svg>
    