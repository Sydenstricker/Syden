<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Syden</title>
    <!--
      A TELA QUE APARECE QUANDO O SYDEN NÃO CONSEGUE ABRIR.

      Ela é a ÚNICA do Syden que não pode vir do site, e não por escolha: se houvesse internet para
      buscá-la, ela não estaria aparecendo. Por isso o desenho está escrito aqui dentro, o texto tem um
      dicionário próprio, e nada nesta página pede nada à rede.

      O código de erro fica junto da explicação. "OFFLINE" sozinho não diz nada a quem só queria
      conversar com os amigos; "sem conexão" sozinho não dá o que repetir ao pedir ajuda.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #1c212b;
        color: #e8eaf0;
        font-family: 'Segoe UI', system-ui, sans-serif;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
      .coelho svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .coelho {
        width: 200px;
        height: 150px;
        margin-inline: auto;
        margin-bottom: 4px;
      }
      h1 {
        color: #f5f6fa;
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #9aa1b1;
        margin: 0 0 20px;
        max-width: 34em;
        line-height: 1.5;
      }
      button {
        background: #f5b83d;
        color: #14161b;
        border: none;
        border-radius: 4px;
        padding: 10px 20px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #ffd27a;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      /* O CÓDIGO É TEXTO DA PÁGINA, e não do desenho: assim o offline.js o traduz junto com o resto. */
      .codigo {
        margin: 0 0 14px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #9aa1b1;
      }
    </style>    </style>
  </head>
  <body>
    <div>
      <!-- O mascote de "sem internet" (rebrand de 05/10/2026): olhos fechados, orelhas murchas e o Wi-Fi
           cortado. Vem do estúdio (animacaoSVG/animacoes_d4.html) pelo animacaoSVG/exportar-mascote.mjs,
           que reescreve o trecho entre os marcadores; as classes levam o prefixo "of-". -->
      <div class="coelho">
        <!-- mascote:sem-internet -->
        <!-- GERADO por animacaoSVG/exportar-mascote.mjs a partir do estúdio animacoes_d4.html — não edite à mão. -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 400 300" role="img" aria-label="Sem conexão">
          <style>
            .of-o-fora, .of-cabeca { fill: var(--creme, #f3ebd8); }
            .of-o-dentro { fill: var(--faixa, #F48FB1); }
            .of-cabeca { stroke: var(--creme, #f3ebd8); stroke-width: 0; stroke-linejoin: round; }
            .p, .creme { fill: var(--creme, #f3ebd8); }
            .m-pupila { fill: #1E2533; }
            .m-brilho { fill: #FFFFFF; }
            .of-m-traco { fill: none; stroke: #1E2533; stroke-width: 1.8; stroke-linecap: round; }
            .of-m-nariz { fill: #C2415A; }
            .of-m-boca { fill: none; stroke: #C2415A; stroke-width: 1.5; stroke-linecap: round; }
            .m-boca-o { fill: #1E2533; }
            .m-bochechas { fill: #F48FB1; opacity: .5; }
            .m-feliz { stroke-width: 2.3; }
            .m-sorrisao { stroke-width: 1.8; }
            .of-orelha { transform-box: fill-box; transform-origin: 50% 100%; }
            .p, .barra, .m-olho, .of-m-olhos { transform-box: fill-box; transform-origin: center; }
            .of-figura { transform-box: view-box; transform-origin: 200px 297px; }
            .codigo text { font-family: 'Syden Instrument Sans', 'Segoe UI', system-ui, sans-serif; font-size: 19px; font-weight: 600; fill: #E8EAF0; letter-spacing: 0.01em; }
            .of-figura { opacity: .9; animation: of-suspiro 3.20s ease-in-out infinite; }
            .of-o-dentro { --faixa: #B7C3D1; }
            .of-orelha-e { transform: rotate(-35deg); animation: of-murchaE 3.20s ease-in-out infinite; }
            .of-orelha-d { transform: rotate(35deg); animation: of-murchaD 3.20s ease-in-out infinite; }
            .of-wifi { fill: none; stroke: #9AA1B1; stroke-width: 6; stroke-linecap: round; animation: of-sinal 2.00s ease-in-out infinite; }
            .of-w2 { animation-delay: 0.25s; }
            .of-wifi-ponto { fill: #9AA1B1; }
            .of-corte { fill: none; stroke: #E5534B; stroke-width: 6; stroke-linecap: round; }
            @keyframes of-suspiro { 0%, 100% { transform: none; } 50% { transform: translateY(5px); } }
            @keyframes of-murchaE { 0%, 100% { transform: rotate(-35deg); } 50% { transform: rotate(-42deg); } }
            @keyframes of-murchaD { 0%, 100% { transform: rotate(35deg); } 50% { transform: rotate(42deg); } }
            @keyframes of-sinal { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
            @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
          </style>
          <g class="of-figura">
            <g transform="translate(100 70) scale(2)">
              <g class="of-orelha of-orelha-e">
                <path class="of-o-fora" d="M31 55 C15 10, 35 -10, 42.5 5 C47.5 15, 42.5 40, 37.5 55 Z"/>
                <path class="of-o-dentro" d="M33 50 C21 15, 35 0, 40 10 C44 17.5, 40 37.5, 36.5 50 Z"/>
              </g>
              <g class="of-orelha of-orelha-d">
                <path class="of-o-fora" d="M69 55 C85 10, 65 -10, 57.5 5 C52.5 15, 57.5 40, 62.5 55 Z"/>
                <path class="of-o-dentro" d="M67 50 C79 15, 65 0, 60 10 C56 17.5, 60 37.5, 63.5 50 Z"/>
              </g>
              <path class="of-cabeca" d="M50 41.5 H50 A36 36 0 0 1 86 77.5 V77.5 A36 36 0 0 1 50 113.5 H50 L50 113.5 L50 113.5 H50 A36 36 0 0 1 14 77.5 V77.5 A36 36 0 0 1 50 41.5 Z"/>
              <g class="of-rosto-m">
                <g class="of-m-olhos"><path class="of-m-traco" d="M29 75 Q34 72.5 39 75 M61 75 Q66 72.5 71 75"/></g>
                <path class="of-m-nariz" d="M47 79 Q50 77 53 79 Q50 83 47 79 Z"/>
                <path class="of-m-boca" d="M45 88 Q50 84 55 88"/>
              </g>
            </g>
          </g>
          <g class="of-selo">
              <circle cx="200" cy="84" r="36" fill="#262C38" stroke="#11141a" stroke-width="7"/>
              <path class="of-wifi of-w1" d="M189 94 Q200 85 211 94"/>
              <path class="of-wifi of-w2" d="M179 84 Q200 66 221 84"/>
              <circle class="of-wifi-ponto" cx="200" cy="103" r="4.5"/>
              <path class="of-corte" d="M183 107 L217 63"/>
            </g>
        </svg>
        <!-- /mascote:sem-internet -->
      </div>
      <p id="codigo" class="codigo">OFFLINE — Sem conexão</p>
      <h1 id="titulo">Não foi possível conectar</h1>
      <p id="explicacao">Verifique sua internet. O servidor também pode estar fora do ar.</p>
      <button id="retry">Tentar de novo</button>
    </div>
    <script src="offline.js"></script>
  </body>
</html>
