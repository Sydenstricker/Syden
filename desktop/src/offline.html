<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Syden</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #313338;
        color: #dbdee1;
        font-family: 'Segoe UI', system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        color: #f2f3f5;
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #949ba4;
        margin: 0 0 20px;
      }
      button {
        background: #5865f2;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 10px 20px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #4752c4;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Não foi possível conectar</h1>
      <p>Verifique sua internet. O servidor também pode estar fora do ar.</p>
      <button id="retry">Tentar de novo</button>
    </div>
    <script src="offline.js"></script>
  </body>
</html>
