<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Compartilhar tela</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #313338;
        color: #dbdee1;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        user-select: none;
      }
      header {
        padding: 20px 20px 0;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 20px;
        color: #f2f3f5;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid #3f4147;
      }
      .tab {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        padding: 8px 12px;
        color: #949ba4;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .tab:hover {
        color: #dbdee1;
      }
      .tab.active {
        color: #f2f3f5;
        border-bottom-color: #5865f2;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
      }
      main::-webkit-scrollbar {
        width: 8px;
      }
      main::-webkit-scrollbar-thumb {
        background: #1a1b1e;
        border-radius: 4px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .card {
        background: #2b2d31;
        border: 2px solid transparent;
        border-radius: 8px;
        padding: 8px;
        cursor: pointer;
        text-align: left;
        color: inherit;
        font: inherit;
      }
      .card:hover {
        background: #35373c;
      }
      .card.selected {
        border-color: #5865f2;
      }
      .card img.thumb {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        background: #000;
        border-radius: 4px;
      }
      .card .name {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .name img {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .card .name span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .empty {
        color: #949ba4;
        text-align: center;
        padding: 40px 0;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        background: #2b2d31;
      }
      .audio {
        flex: 1;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        cursor: pointer;
      }
      .audio input {
        margin-top: 3px;
        accent-color: #5865f2;
      }
      .audio small {
        display: block;
        color: #949ba4;
      }
      .audio[hidden] {
        display: none;
      }
      .audio[hidden] + .spacer {
        flex: 1;
      }
      button.action {
        border: none;
        border-radius: 4px;
        padding: 10px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #cancel {
        background: none;
        color: #dbdee1;
      }
      #cancel:hover {
        text-decoration: underline;
      }
      #share {
        background: #5865f2;
        color: #fff;
      }
      #share:hover:not(:disabled) {
        background: #4752c4;
      }
      #share:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Compartilhar sua tela</h1>
      <div class="tabs">
        <button class="tab active" data-kind="screen">Telas</button>
        <button class="tab" data-kind="window">Janelas</button>
      </div>
    </header>
    <main><div class="grid" id="grid"></div></main>
    <footer>
      <label class="audio" id="audio-option" hidden>
        <input type="checkbox" id="audio" />
        <span>
          Incluir áudio do computador
          <small>Captura todo o som do PC, inclusive a chamada: os outros vão ouvir as próprias vozes de volta.</small>
        </span>
      </label>
      <span class="spacer"></span>
      <button class="action" id="cancel">Cancelar</button>
      <button class="action" id="share" disabled>Compartilhar</button>
    </footer>
    <script src="picker.js"></script>
  </body>
</html>
