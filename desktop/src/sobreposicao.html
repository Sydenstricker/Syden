<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!--
      Esta página vive DENTRO do pacote e não tem acesso ao i18n do site. Isso não é problema porque
      ela não tem texto próprio nenhum: só nomes de pessoas, que não se traduzem. É a mesma situação
      da tela offline (offline.html), com a diferença de que aquela precisou do próprio dicionário.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Syden</title>
    <style>
      /*
        SEM CHAPA DE FUNDO. O jogo aparece inteiro por trás; a legibilidade vem do contorno no texto e
        do anel escuro em volta de cada rosto. Foi medido sobre céu claro e sobre cena noturna: sem o
        contorno, letra branca some no claro — e o jogo muda de cor o tempo todo, então não dá para
        apostar que o fundo vai ser escuro.
      */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        /* A janela é atravessável pelo clique no lado do Electron; isto evita seleção acidental de
           texto caso um dia ela deixe de ser. */
        user-select: none;
        cursor: default;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #lista {
        padding: 8px;
      }
      .pessoa {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 36px;
        padding: 0 6px 0 0;
        border-radius: 8px;
      }
      /* Só quem está falando ganha uma faixa, e ela é o próprio destaque. */
      .pessoa.falando {
        background: rgba(0, 0, 0, 0.45);
      }
      .cara {
        width: 28px;
        height: 28px;
        flex: none;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.55);
      }
      .pessoa.falando .cara {
        box-shadow:
          0 0 0 2px #23a55a,
          0 0 0 4px rgba(0, 0, 0, 0.5);
      }
      .pessoa.mudo .cara,
      .pessoa.mudo .nome {
        opacity: 0.55;
      }
      .nome {
        font-size: 13.5px;
        font-weight: 700;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow:
          0 0 3px rgba(0, 0, 0, 0.95),
          1px 1px 0 rgba(0, 0, 0, 0.8),
          -1px 1px 0 rgba(0, 0, 0, 0.8),
          1px -1px 0 rgba(0, 0, 0, 0.8),
          -1px -1px 0 rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="lista"></div>
    <script src="sobreposicao-tela.js"></script>
  </body>
</html>
