name: Publicar app de desktop

# Crie uma tag para gerar uma versão nova: git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apontar o app para o site no GitHub Pages
        shell: bash
        run: |
          url="${{ vars.JANJA_URL }}"
          [ -z "$url" ] && url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "{ \"url\": \"$url\" }" > desktop/app.config.json
          cat desktop/app.config.json
      - name: Usar o número da tag como versão do app (v0.1.2 → 0.1.2)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        working-directory: desktop
      - name: Compilar o módulo de som (C++)
        run: npm run build:native
        working-directory: desktop
      - run: npx electron-builder --win --publish never
        working-directory: desktop
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: desktop/release/*.exe
