name: Publicar app de desktop

# Crie uma tag para gerar uma versão nova: git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # A máquina "windows-latest" passou a vir com o Visual Studio 18, que o node-gyp ainda não
    # reconhece ("unknown version undefined"), e aí o módulo de som não compila. Fixado na imagem com
    # o Visual Studio 2022 até o node-gyp aprender a nova. Nada mais do app depende desta escolha.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apontar o app para o site no GitHub Pages
        shell: bash
        run: |
          url="${{ vars.JANJA_URL }}"
          [ -z "$url" ] && url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "{ \"url\": \"$url\" }" > desktop/app.config.json
          cat desktop/app.config.json
      - name: Usar o número da tag como versão do app (v0.1.2 → 0.1.2)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        working-directory: desktop
      - name: Compilar o módulo de som (C++)
        shell: bash
        working-directory: desktop
        # Se a compilação falhar, o erro vira uma "anotação" do GitHub. Os registros completos do Actions
        # só abrem para quem tem acesso de administrador ao repositório; as anotações são públicas, então
        # é por elas que dá para descobrir o que houve sem depender de ninguém entrar na conta.
        run: |
          set +e
          npm run build:native 2>&1 | tee compilacao.log
          codigo=${PIPESTATUS[0]}
          if [ "$codigo" -ne 0 ]; then
            compilador=$(grep -iE "error C[0-9]|error MSB|fatal error|LNK[0-9]|cannot open|No such file|not found" compilacao.log | head -10 | tr '\n' '~' | cut -c1-900)
            pilha=$(grep -v "^npm error" compilacao.log | grep -iE "gyp ERR!|gyp info|Error:" | head -14 | tr '\n' '~' | cut -c1-900)
            echo "::error title=Erro do compilador::${compilador:-(nenhuma linha de erro de compilação)}"
            echo "::error title=Onde parou::${pilha}"
            echo "### Falha ao compilar o módulo de som" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 compilacao.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$codigo"
      - run: npx electron-builder --win --publish never
        working-directory: desktop
      - name: Conferir que o módulo de som entrou no instalador
        shell: bash
        working-directory: desktop
        run: |
          alvo=release/win-unpacked/resources/app.asar.unpacked/native/build/Release/syden_audio.node
          if [ -f "$alvo" ]; then
            echo "módulo de som empacotado: $(stat -c%s "$alvo") bytes"
          else
            echo "::error title=Instalador sem o módulo de som::não achei $alvo — a transmissão sairia sem o som limpo, então a versão não vai ser publicada"
            find release -name '*.node' | head -20
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: desktop/release/*.exe
