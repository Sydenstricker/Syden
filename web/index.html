<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#313338" />
    <meta name="description" content="Conversas por voz, vídeo e texto com os amigos." />
    <!-- Caminhos relativos: funcionam na raiz (syden.chat) e numa subpasta, que é onde o site ficava antes. -->
    <!-- A fonte de reserva (Noto) só é baixada quando o idioma escolhido precisa dela; estas duas linhas
         adiantam a conversa com o servidor para ela chegar mais rápido quando isso acontecer. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" href="icon-192.png" />
    <title>Syden</title>

    <!--
      A ESPERA ANTES DA ESPERA.

      O Syden tem uma abertura bonita (SplashLogo.tsx), e ela só começa depois que o JavaScript chega:
      são 1,26 MB para baixar e interpretar. Até lá esta página era um retângulo BRANCO e vazio — branco
      porque a folha de estilo do app também ainda não chegou. Em internet boa passa num piscar; em
      internet ruim são segundos parecendo que o app não abriu.

      Por isso o fundo e o coelho estão escritos AQUI, nesta página, e não vêm de arquivo nenhum: nada
      para baixar, nada para esperar. Aparecem no primeiro quadro.

      E NÃO TEM TEXTO, de propósito (ver CLAUDE.md). Nesta altura o mecanismo de idiomas ainda não
      existe — traduzi-lo exigiria um segundo sistema de tradução só para esta tela. Um coelho girando
      dispensa legenda e resolve os 74 idiomas de uma vez.
    -->
    <style>
      /* O fundo primeiro: é o que impede o clarão branco antes de a folha de estilo do app chegar. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #313338;
      }

      #abertura {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;

        /* ELA PRECISA SER OPACA, e não foi na primeira versão — o defeito apareceu na tela: sem fundo
           próprio, o app desenhava por baixo e o coelho ficava boiando por cima dos botões de entrar.
           O fundo do <body> não bastava, porque o que o React desenha pinta por cima dele. */
        background: #313338;

        /* Acima de tudo do Syden, inclusive das janelas (o maior z-index do app é 3000). Uma abertura
           que fica ATRÁS do que ela deveria esconder não esconde nada. */
        z-index: 9000;

        /* O clique atravessa, de propósito. São dois riscos, e este é o menor: se um dia ela deixar de
           ser removida, um clique perdido é ruim, mas um app permanentemente travado por uma camada
           invisível é pior — e o segundo é o que aconteceria com pointer-events normal. */
        pointer-events: none;
      }

      /* A ABERTURA É SEMPRE ESCURA, inclusive para quem usa o tema claro. Não é descuido: o coelho é
         uma silhueta BRANCA, e sobre fundo claro sobraria só o arco vermelho girando sozinho. Dois
         segundos de tela escura no começo é o que todo app faz — e é curto demais para incomodar. */

      #abertura svg {
        width: min(220px, 45vw, 40vh);
        height: min(220px, 45vw, 40vh);
      }

      /*
        QUEM TIRA A ABERTURA É O APP, e não um seletor de CSS.

        A primeira versão usava #root:not(:empty), que esconde assim que o React monta — e o React
        monta ANTES de a sessão ser conferida. A pessoa via o coelho sumir e uma tela vazia no lugar,
        esperando o servidor. Agora quem decide é web/src/abertura.ts, que só a dispensa quando há o
        que mostrar, e nunca antes de dois segundos.

        Se o pacote nunca chegar, ela fica — que é o certo: não há nada para pôr no lugar.
      */
      #abertura.saindo {
        opacity: 0;
        transition: opacity 0.32s ease-out;
      }

      @keyframes abertura-gira {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes abertura-respira {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }

      .abertura-arco {
        fill: none;
        stroke: #bc1d1d;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 90 400;
        transform-origin: 200px 200px;
        animation: abertura-gira 2.5s linear infinite;
      }

      .abertura-respira {
        transform-origin: 200px 240px;
        animation: abertura-respira 1.8s ease-in-out infinite;
      }

      /* Quem pediu menos movimento ao sistema vê o desenho parado. O coelho continua ali dizendo
         "carregando"; o que some é o giro, que é o que incomoda quem tem enxaqueca ou vertigem. */
      @media (prefers-reduced-motion: reduce) {
        .abertura-arco,
        .abertura-respira {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- O desenho vem de animacaoSVG/loadingMinimalista.svg, escolhido entre os do estúdio porque é o
         único que sobrevive pequeno e não tem fundo próprio — aqui ele fica sobre o fundo do Syden. -->
    <div id="abertura" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
        <circle class="abertura-arco" cx="200" cy="200" r="150" />
        <g class="abertura-respira">
          <path fill="#ffffff" d="M 162 180 C 130 90, 170 50, 185 80 C 195 100, 185 150, 175 180 Z" />
          <path fill="#f48fb1" d="M 166 170 C 142 100, 170 70, 180 90 C 188 105, 180 145, 173 170 Z" />
          <path fill="#ffffff" d="M 238 180 C 270 90, 230 50, 215 80 C 205 100, 215 150, 225 180 Z" />
          <path fill="#f48fb1" d="M 234 170 C 258 100, 230 70, 220 90 C 212 105, 220 145, 227 170 Z" />
          <circle fill="#ffffff" cx="200" cy="230" r="66" />
        </g>
      </svg>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
