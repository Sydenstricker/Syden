<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1c212b" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada — Syden</title>
    <!--
      A PÁGINA DE ENDEREÇO QUE NÃO EXISTE.

      O GitHub Pages serve este arquivo sozinho para qualquer endereço do site que não exista. Antes dela
      quem errava um link caía na página genérica do GitHub, que nem diz que aquilo é o Syden.

      Os endereços aqui dentro são ABSOLUTOS ("/site.css", e não "site.css"), de propósito: esta página
      aparece em qualquer profundidade — syden.chat/a/b/c mostra ela também — e um caminho relativo
      procuraria o estilo em /a/b/site.css, que não existe.

      O formato é o das telas de erro (ver CLAUDE.md): o desenho, o código com a descrição, e o caminho de
      volta. O mascote é o do estúdio (preset "Erro 404"), o mesmo arquivo que o app usa.
      Está em português, como o resto do site de apresentação.
    -->
    <link rel="icon" href="/icon-192.png?v=d4" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <main class="nao-encontrada">
      <img src="/app/mascote/erro-404.svg" width="240" height="180" alt="" aria-hidden="true" />
      <p class="nao-encontrada-codigo">ERRO 404 — Página não encontrada</p>
      <h1>Esta página não existe</h1>
      <p>O endereço pode ter mudado, ou foi digitado com algum detalhe diferente.</p>
      <div class="acoes">
        <a class="botao botao-marca" href="/">Ir para o início</a>
        <a class="botao botao-vazio" href="/app/">Abrir o Syden</a>
      </div>
    </main>
  </body>
</html>
