<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 400 300" role="img" aria-label="Apresentação">
  <style>
    .o-fora, .cabeca { fill: var(--creme, #f3ebd8); }
    .o-dentro { fill: var(--faixa, #F48FB1); }
    .cabeca { stroke: var(--creme, #f3ebd8); stroke-width: 0; stroke-linejoin: round; }
    .p, .creme { fill: var(--creme, #f3ebd8); }
    .m-pupila { fill: #1E2533; }
    .m-brilho { fill: #FFFFFF; }
    .m-traco { fill: none; stroke: #1E2533; stroke-width: 1.8; stroke-linecap: round; }
    .m-nariz { fill: #C2415A; }
    .m-boca { fill: none; stroke: #C2415A; stroke-width: 1.5; stroke-linecap: round; }
    .m-boca-o { fill: #1E2533; }
    .m-bochechas { fill: #F48FB1; opacity: .5; }
    .m-feliz { stroke-width: 2.3; }
    .m-sorrisao { stroke-width: 1.8; }
    .orelha { transform-box: fill-box; transform-origin: 50% 100%; }
    .p, .barra, .m-olho, .m-olhos { transform-box: fill-box; transform-origin: center; }
    .figura { transform-box: view-box; transform-origin: 200px 297px; }
    .codigo text { font-family: 'Syden Instrument Sans', 'Segoe UI', system-ui, sans-serif; font-size: 19px; font-weight: 600; fill: #E8EAF0; letter-spacing: 0.01em; }
    .quadro-moldura { fill: #262C38; stroke: #f3ebd8; stroke-width: 2.5; }
    .quadro-pe { fill: none; stroke: #f3ebd8; stroke-width: 2.5; stroke-linecap: round; }
    .barra-q { fill: var(--faixa, #F48FB1); transform-box: fill-box; transform-origin: center bottom; animation: crescer 3.00s cubic-bezier(.34,1.56,.64,1) infinite; }
    .q2 { animation-delay: 0.25s; }
    .q3 { animation-delay: 0.50s; }
    .varinha { fill: none; stroke: #C9A26B; stroke-width: 2.2; stroke-linecap: round; transform-box: fill-box; transform-origin: 0% 100%; animation: apontar 3.00s ease-in-out infinite; }
    .m-falando { transform-box: fill-box; transform-origin: center top; animation: falarBoca 0.45s ease-in-out infinite; }
    .m-olho { animation: piscar 3.80s ease-in-out infinite; }
    .orelha-e, .orelha-d { animation: atento 3.00s ease-in-out infinite; }
    @keyframes crescer { 0%, 8% { transform: scaleY(0); opacity: 1; } 30%, 85% { transform: none; opacity: 1; } 100% { transform: none; opacity: 0; } }
    @keyframes apontar { 0%, 20%, 100% { transform: none; } 35% { transform: rotate(-12deg); } 55% { transform: rotate(8deg); } 75% { transform: rotate(-4deg); } }
    @keyframes falarBoca { 0%, 100% { transform: scaleY(.4); } 50% { transform: none; } }
    @keyframes piscar { 0%, 92%, 100% { transform: none; } 95% { transform: scaleY(.1); } }
    @keyframes atento { 0%, 100% { transform: none; } 50% { transform: scaleY(1.05); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="figura">
    <g transform="translate(100 70) scale(2)">
      <g class="orelha orelha-e">
        <path class="o-fora" d="M31 55 C15 10, 35 -10, 42.5 5 C47.5 15, 42.5 40, 37.5 55 Z"/>
        <path class="o-dentro" d="M33 50 C21 15, 35 0, 40 10 C44 17.5, 40 37.5, 36.5 50 Z"/>
      </g>
      <g class="orelha orelha-d">
        <path class="o-fora" d="M69 55 C85 10, 65 -10, 57.5 5 C52.5 15, 57.5 40, 62.5 55 Z"/>
        <path class="o-dentro" d="M67 50 C79 15, 65 0, 60 10 C56 17.5, 60 37.5, 63.5 50 Z"/>
      </g>
      <path class="cabeca" d="M50 41.5 H50 A36 36 0 0 1 86 77.5 V77.5 A36 36 0 0 1 50 113.5 H50 L50 113.5 L50 113.5 H50 A36 36 0 0 1 14 77.5 V77.5 A36 36 0 0 1 50 41.5 Z"/>
      <g class="rosto-m">
        <g class="m-olhos"><g class="m-olho m-olho-e"><circle class="m-pupila" cx="34" cy="72.5" r="4"/><circle class="m-brilho" cx="33" cy="71" r="1.25"/></g>
        <g class="m-olho m-olho-d"><circle class="m-pupila" cx="66" cy="72.5" r="4"/><circle class="m-brilho" cx="65" cy="71" r="1.25"/></g></g>
        <path class="m-nariz" d="M47 79 Q50 77 53 79 Q50 83 47 79 Z"/>
        <ellipse class="m-boca-o m-falando" cx="50" cy="87.5" rx="2.8" ry="2.6"/>
      </g>
      <g class="quadro">
        <rect class="quadro-moldura" x="96" y="38" width="46" height="36" rx="3"/>
        <rect class="barra-q q1" x="103" y="56" width="7" height="12" rx="1.5"/>
        <rect class="barra-q q2" x="115" y="50" width="7" height="18" rx="1.5"/>
        <rect class="barra-q q3" x="127" y="44" width="7" height="24" rx="1.5"/>
        <path class="quadro-pe" d="M119 74 V92 M110 92 H128"/>
      </g>
      <path class="varinha" d="M84 92 L104 64"/>
    </g>
  </g>
</svg>
