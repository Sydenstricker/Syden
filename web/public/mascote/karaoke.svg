<!-- GERADO por animacaoSVG/exportar-mascote.mjs a partir do estúdio animacoes_d4.html — não edite à mão. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 400 300" role="img" aria-label="Karaokê">
  <style>
    .o-fora, .cabeca { fill: var(--creme, #f3ebd8); }
    .o-dentro { fill: var(--faixa, #F48FB1); }
    .cabeca { stroke: var(--creme, #f3ebd8); stroke-width: 0; stroke-linejoin: round; }
    .p, .creme { fill: var(--creme, #f3ebd8); }
    .m-pupila { fill: #1E2533; }
    .m-brilho { fill: #FFFFFF; }
    .m-traco { fill: none; stroke: #1E2533; stroke-width: 1.8; stroke-linecap: round; }
    .m-nariz { fill: #C2415A; }
    .m-boca { fill: none; stroke: #C2415A; stroke-width: 1.5; stroke-linecap: round; }
    .m-boca-o { fill: #1E2533; }
    .m-bochechas { fill: #F48FB1; opacity: .5; }
    .m-feliz { stroke-width: 2.3; }
    .m-sorrisao { stroke-width: 1.8; }
    .orelha { transform-box: fill-box; transform-origin: 50% 100%; }
    .p, .barra, .m-olho, .m-olhos { transform-box: fill-box; transform-origin: center; }
    .figura { transform-box: view-box; transform-origin: 200px 297px; }
    .codigo text { font-family: 'Syden Instrument Sans', 'Segoe UI', system-ui, sans-serif; font-size: 19px; font-weight: 600; fill: #E8EAF0; letter-spacing: 0.01em; }
    .nota ellipse { fill: #F48FB1; }
    .nota path { fill: none; stroke: #F48FB1; stroke-width: 1.4; stroke-linecap: round; }
    .nota { transform-box: fill-box; transform-origin: center; opacity: 0; animation: nota 4.80s ease-out infinite; }
    .n2 { animation-delay: 1.70s; }
    .n3 { animation-delay: 3.10s; }
    @keyframes nota { 0% { opacity: 0; transform: translate(0, 4px) rotate(-8deg); } 8% { opacity: 1; } 30% { opacity: 0; transform: translate(4px, -14px) rotate(10deg); } 100% { opacity: 0; } }
    .mic-cabo { stroke: #2A3142; stroke-width: 4.5; stroke-linecap: round; }
    .mic-cabeca { fill: #3A4255; }
    .mic-grade { stroke: #8D95A6; stroke-width: 1.2; stroke-linecap: round; }
    .m-cantando { transform-box: fill-box; transform-origin: center top; animation: cantar 0.60s ease-in-out infinite; }
    .figura { animation: ritmo 1.20s ease-in-out infinite; }
    .orelha-e { animation: ritmoE 1.20s ease-in-out infinite; }
    .orelha-d { animation: ritmoD 1.20s ease-in-out infinite; }
    .letra-fundo { fill: #2A3142; }
    .letra-cheia { fill: var(--faixa, #F48FB1); transform-box: fill-box; transform-origin: left center; animation: letra 3.60s linear infinite; }
    @keyframes cantar { 0%, 100% { transform: scaleY(.55); } 50% { transform: none; } }
    /* A opacidade vai declarada em todos os pontos: só no último, o navegador apagava a barra desde o começo. */
    @keyframes letra { 0% { transform: scaleX(0); opacity: 1; } 85% { transform: none; opacity: 1; } 100% { transform: none; opacity: 0; } }
    @keyframes ritmo { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateY(-2px); } }
    @keyframes ritmoE { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }
    @keyframes ritmoD { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="figura">
    <g transform="translate(100 70) scale(2)">
      <g class="orelha orelha-e">
        <path class="o-fora" d="M31 55 C15 10, 35 -10, 42.5 5 C47.5 15, 42.5 40, 37.5 55 Z"/>
        <path class="o-dentro" d="M33 50 C21 15, 35 0, 40 10 C44 17.5, 40 37.5, 36.5 50 Z"/>
      </g>
      <g class="orelha orelha-d">
        <path class="o-fora" d="M69 55 C85 10, 65 -10, 57.5 5 C52.5 15, 57.5 40, 62.5 55 Z"/>
        <path class="o-dentro" d="M67 50 C79 15, 65 0, 60 10 C56 17.5, 60 37.5, 63.5 50 Z"/>
      </g>
      <path class="cabeca" d="M50 41.5 H50 A36 36 0 0 1 86 77.5 V77.5 A36 36 0 0 1 50 113.5 H50 L50 113.5 L50 113.5 H50 A36 36 0 0 1 14 77.5 V77.5 A36 36 0 0 1 50 41.5 Z"/>
      <g class="rosto-m">
        <g class="m-bochechas"><ellipse cx="25.5" cy="82" rx="5.5" ry="3.2"/><ellipse cx="74.5" cy="82" rx="5.5" ry="3.2"/></g>
        <g class="m-olhos"><path class="m-traco m-feliz" d="M29 72.5 Q34 67.5 39 72.5 M61 72.5 Q66 67.5 71 72.5"/></g>
        <path class="m-nariz" d="M47 79 Q50 77 53 79 Q50 83 47 79 Z"/>
        <ellipse class="m-boca-o m-cantando" cx="50" cy="88" rx="3.4" ry="4"/>
      </g>
      <g class="microfone">
        <path class="mic-cabo" d="M70 100 L83 120"/>
        <circle class="mic-cabeca" cx="67" cy="96" r="6.5"/>
        <path class="mic-grade" d="M63 94 H71 M62.5 97.5 H71.5"/>
      </g>
      <g class="notas"><g class="nota n1"><ellipse cx="88" cy="56" rx="2.6" ry="2" transform="rotate(-20 88 56)"/><path d="M90.3 55.5 V44 Q94 45.5 94 49"/></g><g class="nota n2"><ellipse cx="10" cy="60" rx="2.6" ry="2" transform="rotate(-20 10 60)"/><path d="M12.3 59.5 V48 Q16 49.5 16 53"/></g><g class="nota n3"><ellipse cx="94" cy="74" rx="2.6" ry="2" transform="rotate(-20 94 74)"/><path d="M96.3 73.5 V62 Q100 63.5 100 67"/></g></g>
      <g class="letra"><rect class="letra-fundo" x="18" y="124" width="64" height="5" rx="2.5"/><rect class="letra-cheia" x="18" y="124" width="64" height="5" rx="2.5"/></g>
    </g>
  </g>
</svg>
