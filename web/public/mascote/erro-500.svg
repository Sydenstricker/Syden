    .orelha { transform-box: fill-box; transform-origin: 50% 100%; }
    .p, .barra, .m-olho, .m-olhos { transform-box: fill-box; transform-origin: center; }
    .figura { transform-box: view-box; transform-origin: 200px 297px; }
    .codigo text { font-family: 'Syden Instrument Sans', 'Segoe UI', system-ui, sans-serif; font-size: 19px; font-weight: 600; fill: #E8EAF0; letter-spacing: 0.01em; }
    .rack { fill: none; stroke: #9AA1B1; stroke-width: 4; }
    .ranhura { fill: none; stroke: #9AA1B1; stroke-width: 3; stroke-linecap: round; }
    .luz-erro { animation: piscarErro 0.90s steps(1) infinite; }
    @keyframes piscarErro { 0% { opacity: 1; } 50% { opacity: .15; } }
    .caida { transform-box: fill-box; animation: balancar 2.60s ease-in-out infinite; }
    .caida-e { transform-origin: 90% 5%; }
    .caida-d { transform-origin: 10% 5%; animation-name: balancarD; }
    .figura { animation: tremer 2.60s ease-in-out infinite; }
    @keyframes tremer { 0%, 78%, 100% { transform: none; } 82% { transform: translateX(-5px) rotate(-1.5deg); } 86% { transform: translateX(5px) rotate(1.5deg); } 90% { transform: translateX(-3px); } 94% { transform: translateX(2px); } }
    @keyframes balancar { 0%, 80%, 100% { transform: none; } 85% { transform: rotate(7deg); } 90% { transform: rotate(-4deg); } 95% { transform: rotate(2deg); } }
    @keyframes balancarD { 0%, 80%, 100% { transform: none; } 85% { transform: rotate(-7deg); } 90% { transform: rotate(4deg); } 95% { transform: rotate(-2deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
