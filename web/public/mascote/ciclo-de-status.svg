<!-- GERADO por animacaoSVG/exportar-mascote.mjs a partir do estúdio animacoes_d4.html — não edite à mão. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 400 300" role="img" aria-label="Status do coelho">
  <style>
    .o-fora, .cabeca { fill: var(--creme, #f3ebd8); }
    .o-dentro { fill: var(--faixa, #F48FB1); }
    .cabeca { stroke: var(--creme, #f3ebd8); stroke-width: 0; stroke-linejoin: round; }
    .p, .creme { fill: var(--creme, #f3ebd8); }
    .m-pupila { fill: #1E2533; }
    .m-brilho { fill: #FFFFFF; }
    .m-traco { fill: none; stroke: #1E2533; stroke-width: 1.8; stroke-linecap: round; }
    .m-nariz { fill: #C2415A; }
    .m-boca { fill: none; stroke: #C2415A; stroke-width: 1.5; stroke-linecap: round; }
    .m-boca-o { fill: #1E2533; }
    .m-bochechas { fill: #F48FB1; opacity: .5; }
    .m-feliz { stroke-width: 2.3; }
    .m-sorrisao { stroke-width: 1.8; }
    .orelha { transform-box: fill-box; transform-origin: 50% 100%; }
    .p, .barra, .m-olho, .m-olhos { transform-box: fill-box; transform-origin: center; }
    .figura { transform-box: view-box; transform-origin: 200px 297px; }
    .codigo text { font-family: 'Syden Instrument Sans', 'Segoe UI', system-ui, sans-serif; font-size: 19px; font-weight: 600; fill: #E8EAF0; letter-spacing: 0.01em; }
    /* A troca das orelhas no offline é SECA (step-end) e numa animação à parte: posta junto da postura,
       a opacidade era interpolada desde o começo do ciclo e as orelhas iam sumindo já no online. */
    .orelha-e { animation: cicloE 8.00s cubic-bezier(.34,1.56,.64,1) infinite, orelhasSomem 8.00s step-end infinite; }
    .orelha-d { animation: cicloD 8.00s cubic-bezier(.34,1.56,.64,1) infinite, orelhasSomem 8.00s step-end infinite; }
    @keyframes orelhasSomem { 0% { opacity: 1; } 75% { opacity: 0; } }
    .orelhas-off { opacity: 0; animation: orelhasOff 8.00s step-end infinite; }
    .o-dentro { animation: faixa 8.00s step-end infinite; }
    .o-fora, .cabeca { animation: pele 8.00s step-end infinite; }
    .f-aus, .f-dnd, .f-off { opacity: 0; }
    .f-on { animation: rostoOn 8.00s step-end infinite; }
    .f-aus { animation: rostoAus 8.00s step-end infinite; }
    .f-dnd { animation: rostoDnd 8.00s step-end infinite; }
    .f-off { animation: rostoOff 8.00s step-end infinite; }
    .f-on .m-olho { animation: piscar 2.70s ease-in-out infinite; }
    /* Dormindo: os "z" nascem perto da cabeça e sobem crescendo e sumindo, um atrás do outro. */
    .z { fill: none; stroke: #f3ebd8; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transform-box: fill-box; transform-origin: center; opacity: 0; animation: zzz 2.40s ease-out infinite; }
    .z2 { animation-delay: 0.80s; }
    .z3 { animation-delay: 1.60s; }
    @keyframes zzz { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(14px, -24px) scale(1.5); } }
    /* Imerso: os olhos leem a tela da esquerda para a direita e voltam ao começo da linha. */
    .f-dnd .m-olhos { animation: ler 2.40s ease-in-out infinite; }
    @keyframes ler { 0% { transform: translateX(-1.6px); } 70% { transform: translateX(1.6px); } 78%, 100% { transform: translateX(-1.6px); } }
    .nb-tampa { fill: #2A3142; }
    .nb-logo { fill: var(--faixa, #F48FB1); opacity: .9; }
    .nb-base { fill: #3A4255; }
    @keyframes cicloE { 0%, 22% { transform: none; } 25%, 47% { transform: rotate(-58deg) scaleY(.92); } 50%, 72% { transform: rotate(-10deg); } 75%, 100% { transform: none; } }
    @keyframes cicloD { 0%, 47% { transform: none; } 50%, 72% { transform: rotate(10deg); } 75%, 100% { transform: none; } }
    @keyframes orelhasOff { 0% { opacity: 0; } 75% { opacity: 1; } }
    @keyframes faixa { 0% { fill: #2FBF71; } 25% { fill: #E8A93A; } 50% { fill: #E5534B; } 75% { fill: #5C6475; } }
    @keyframes pele { 0% { fill: #f3ebd8; } 75% { fill: #A9AFBB; } }
    @keyframes rostoOn { 0% { opacity: 1; } 25% { opacity: 0; } }
    @keyframes rostoAus { 0% { opacity: 0; } 25% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes rostoDnd { 0% { opacity: 0; } 50% { opacity: 1; } 75% { opacity: 0; } }
    @keyframes rostoOff { 0% { opacity: 0; } 75% { opacity: 1; } }
    @keyframes piscar { 0%, 90%, 100% { transform: none; } 95% { transform: scaleY(.1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="figura">
    <g transform="translate(100 70) scale(2)">
      <g class="orelha orelha-e">
        <path class="o-fora" d="M31 55 C15 10, 35 -10, 42.5 5 C47.5 15, 42.5 40, 37.5 55 Z"/>
        <path class="o-dentro" d="M33 50 C21 15, 35 0, 40 10 C44 17.5, 40 37.5, 36.5 50 Z"/>
      </g>
      <g class="orelha orelha-d">
        <path class="o-fora" d="M69 55 C85 10, 65 -10, 57.5 5 C52.5 15, 57.5 40, 62.5 55 Z"/>
        <path class="o-dentro" d="M67 50 C79 15, 65 0, 60 10 C56 17.5, 60 37.5, 63.5 50 Z"/>
      </g><g class="orelhas-off"><g class="caida caida-e">
        <path class="o-fora" d="M36 47 C24 40, 8 50, 6 76 C5 92, 10 102, 16 101 C22 100, 22 88, 22 76 C22 62, 28 54, 38 52 Z"/>
        <path class="o-dentro" d="M31 53 C21 53, 13 63, 12 78 C11 90, 14 96, 16.5 95 C19 94, 18.5 86, 18.5 76 C18.5 64, 23 58, 31 56 Z"/>
      </g>
      <g class="caida caida-d">
        <path class="o-fora" d="M64 47 C76 40, 92 50, 94 76 C95 92, 90 102, 84 101 C78 100, 78 88, 78 76 C78 62, 72 54, 62 52 Z"/>
        <path class="o-dentro" d="M69 53 C79 53, 87 63, 88 78 C89 90, 86 96, 83.5 95 C81 94, 81.5 86, 81.5 76 C81.5 64, 77 58, 69 56 Z"/>
      </g></g>
      <path class="cabeca" d="M50 41.5 H50 A36 36 0 0 1 86 77.5 V77.5 A36 36 0 0 1 50 113.5 H50 L50 113.5 L50 113.5 H50 A36 36 0 0 1 14 77.5 V77.5 A36 36 0 0 1 50 41.5 Z"/>
      <g class="f-on"><g class="rosto-m">
        <g class="m-olhos"><g class="m-olho m-olho-e"><circle class="m-pupila" cx="34" cy="72.5" r="4"/><circle class="m-brilho" cx="33" cy="71" r="1.25"/></g>
        <g class="m-olho m-olho-d"><circle class="m-pupila" cx="66" cy="72.5" r="4"/><circle class="m-brilho" cx="65" cy="71" r="1.25"/></g></g>
        <path class="m-nariz" d="M47 79 Q50 77 53 79 Q50 83 47 79 Z"/>
        <path class="m-boca" d="M45 84.5 Q50 89.5 55 84.5"/>
      </g></g>
      <g class="f-aus"><g class="rosto-m">
        <g class="m-olhos"><path class="m-traco" d="M29 75 Q34 72.5 39 75 M61 75 Q66 72.5 71 75"/></g>
        <path class="m-nariz" d="M47 79 Q50 77 53 79 Q50 83 47 79 Z"/>
        <circle class="m-boca-o" cx="50" cy="87.5" r="2.5"/>
      </g>
        <g class="zzz"><path class="z z1" d="M73 45 H78 L73 51 H78"/><path class="z z2" d="M73 45 H78 L73 51 H78"/><path class="z z3" d="M73 45 H78 L73 51 H78"/></g>
      </g>
      <g class="f-dnd"><g class="rosto-m">
        <g class="m-olhos"><g class="m-olho m-olho-e"><circle class="m-pupila" cx="34" cy="74.5" r="4"/><circle class="m-brilho" cx="33" cy="73.3" r="1.2"/></g>
        <g class="m-olho m-olho-d"><circle class="m-pupila" cx="66" cy="74.5" r="4"/><circle class="m-brilho" cx="65" cy="73.3" r="1.2"/></g></g>
        <path class="m-nariz" d="M47 79 Q50 77 53 79 Q50 83 47 79 Z"/>
        <path class="m-boca" d="M45 84.5 Q50 89.5 55 84.5"/>
      </g>
        <g class="notebook">
          <rect class="nb-tampa" x="31" y="91" width="38" height="22" rx="3"/>
          <circle class="nb-logo" cx="50" cy="102" r="2.2"/>
          <rect class="nb-base" x="25" y="111.5" width="50" height="4" rx="2"/>
        </g>
      </g>
      <g class="f-off"><g class="rosto-m">
        <g class="m-olhos"><path class="m-traco" d="M29 75 Q34 72.5 39 75 M61 75 Q66 72.5 71 75"/></g>
        <path class="m-nariz" d="M47 79 Q50 77 53 79 Q50 83 47 79 Z"/>
        <path class="m-boca" d="M47 86.5 Q50 87.5 53 86.5"/>
      </g></g>
    </g>
  </g>
</svg>
