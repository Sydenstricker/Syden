<!-- GERADO por animacaoSVG/exportar-mascote.mjs a partir do estúdio animacoes_d4.html — não edite à mão. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 40 280 280" role="img" aria-label="Assistir junto">
  <style>
    .o-fora, .cabeca { fill: var(--creme, #f3ebd8); }
    .o-dentro { fill: var(--faixa, #F48FB1); }
    .cabeca { stroke: var(--creme, #f3ebd8); stroke-width: 0; stroke-linejoin: round; }
    .p, .creme { fill: var(--creme, #f3ebd8); }
    .m-pupila { fill: #1E2533; }
    .m-brilho { fill: #FFFFFF; }
    .m-traco { fill: none; stroke: #1E2533; stroke-width: 1.8; stroke-linecap: round; }
    .m-nariz { fill: #C2415A; }
    .m-boca { fill: none; stroke: #C2415A; stroke-width: 1.5; stroke-linecap: round; }
    .m-boca-o { fill: #1E2533; }
    .m-bochechas { fill: #F48FB1; opacity: .5; }
    .m-feliz { stroke-width: 2.3; }
    .m-sorrisao { stroke-width: 1.8; }
    .orelha { transform-box: fill-box; transform-origin: 50% 100%; }
    .p, .barra, .m-olho, .m-olhos { transform-box: fill-box; transform-origin: center; }
    .figura { transform-box: view-box; transform-origin: 200px 297px; }
    .codigo text { font-family: 'Syden Instrument Sans', 'Segoe UI', system-ui, sans-serif; font-size: 19px; font-weight: 600; fill: #E8EAF0; letter-spacing: 0.01em; }
    .balde { fill: #f3ebd8; stroke: #2A3142; stroke-width: 1.2; }
    .balde-listra { stroke: var(--faixa, #F48FB1); stroke-width: 3.2; }
    .grao { fill: #FFF6DE; stroke: #E8D9B0; stroke-width: .8; }
    .grao-pula { transform-box: fill-box; transform-origin: center; opacity: 0; animation: estourar 3.40s ease-out infinite; }
    .luz-da-tela { fill: #BFD7F5; mix-blend-mode: soft-light; opacity: .0; animation: tela 2.20s steps(1) infinite; }
    .r-oh { opacity: 0; animation: oh 6.00s step-end infinite; }
    .r-assistindo { animation: assistindo 6.00s step-end infinite; }
    .orelha-e, .orelha-d { animation: susto 6.00s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes estourar { 0%, 55% { opacity: 0; transform: none; } 60% { opacity: 1; } 80% { opacity: 1; transform: translate(4px, -16px) rotate(90deg); } 100% { opacity: 0; transform: translate(7px, -4px) rotate(180deg); } }
    @keyframes tela { 0% { opacity: .0; } 20% { opacity: .35; } 45% { opacity: .1; } 70% { opacity: .45; } 85% { opacity: .2; } }
    @keyframes oh { 0% { opacity: 0; } 62% { opacity: 1; } 76% { opacity: 0; } }
    @keyframes assistindo { 0% { opacity: 1; } 62% { opacity: 0; } 76% { opacity: 1; } }
    @keyframes susto { 0%, 60%, 80%, 100% { transform: none; } 64% { transform: scaleY(1.12); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="figura">
    <g transform="translate(100 70) scale(2)">
