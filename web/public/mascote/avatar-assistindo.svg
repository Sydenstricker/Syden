        <path class="o-fora" d="M31 55 C15 10, 35 -10, 42.5 5 C47.5 15, 42.5 40, 37.5 55 Z"/>
        <path class="o-dentro" d="M33 50 C21 15, 35 0, 40 10 C44 17.5, 40 37.5, 36.5 50 Z"/>
      </g>
      <g class="orelha orelha-d">
        <path class="o-fora" d="M69 55 C85 10, 65 -10, 57.5 5 C52.5 15, 57.5 40, 62.5 55 Z"/>
        <path class="o-dentro" d="M67 50 C79 15, 65 0, 60 10 C56 17.5, 60 37.5, 63.5 50 Z"/>
      </g>
      <path class="cabeca" d="M50 41.5 H50 A36 36 0 0 1 86 77.5 V77.5 A36 36 0 0 1 50 113.5 H50 L50 113.5 L50 113.5 H50 A36 36 0 0 1 14 77.5 V77.5 A36 36 0 0 1 50 41.5 Z"/>
      <g class="r-assistindo"><g class="rosto-m">
        <g class="m-olhos"><g class="m-olho m-olho-e"><circle class="m-pupila" cx="34" cy="70.5" r="4"/><circle class="m-brilho" cx="33" cy="69" r="1.25"/></g>
        <g class="m-olho m-olho-d"><circle class="m-pupila" cx="66" cy="70.5" r="4"/><circle class="m-brilho" cx="65" cy="69" r="1.25"/></g></g>
        <path class="m-nariz" d="M47 79 Q50 77 53 79 Q50 83 47 79 Z"/>
        <path class="m-boca" d="M45 84.5 Q50 89.5 55 84.5"/>
      </g></g>
      <g class="r-oh"><g class="rosto-m">
        <g class="m-olhos"><g class="m-olho m-olho-e"><circle class="m-pupila" cx="34" cy="70.5" r="4"/><circle class="m-brilho" cx="33" cy="69" r="1.25"/></g>
        <g class="m-olho m-olho-d"><circle class="m-pupila" cx="66" cy="70.5" r="4"/><circle class="m-brilho" cx="65" cy="69" r="1.25"/></g></g>
        <path class="m-nariz" d="M47 79 Q50 77 53 79 Q50 83 47 79 Z"/>
        <circle class="m-boca-o" cx="50" cy="87.5" r="2.5"/>
      </g></g>
      <ellipse class="luz-da-tela" cx="50" cy="70" rx="30" ry="24"/>
      <g class="pipoca">
        <path class="balde" d="M33 99 L37 124 H63 L67 99 Z"/>
        <path class="balde-listra" d="M41.5 99 L43.5 124 M50 99 V124 M58.5 99 L56.5 124"/>
        <circle class="grao" cx="38" cy="98" r="3.6"/><circle class="grao" cx="44.5" cy="95.5" r="4"/><circle class="grao" cx="51" cy="97" r="3.8"/>
        <circle class="grao" cx="57" cy="95" r="3.9"/><circle class="grao" cx="62.5" cy="98" r="3.5"/>
        <circle class="grao grao-pula" cx="50" cy="94" r="3.2"/>
      </g>
    </g>
  </g>
</svg>
