<!-- GERADO por animacaoSVG/exportar-mascote.mjs a partir do estúdio animacoes_d4.html — não edite à mão. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 400 300" role="img" aria-label="Syden">
  <style>
    .o-fora, .cabeca { fill: var(--creme, #f3ebd8); }
    .o-dentro { fill: var(--faixa, #F48FB1); }
    .cabeca { stroke: var(--creme, #f3ebd8); stroke-width: 0; stroke-linejoin: round; }
    .p, .creme { fill: var(--creme, #f3ebd8); }
    .m-pupila { fill: #1E2533; }
    .m-brilho { fill: #FFFFFF; }
    .m-traco { fill: none; stroke: #1E2533; stroke-width: 1.8; stroke-linecap: round; }
    .m-nariz { fill: #C2415A; }
    .m-boca { fill: none; stroke: #C2415A; stroke-width: 1.5; stroke-linecap: round; }
    .m-boca-o { fill: #1E2533; }
    .m-bochechas { fill: #F48FB1; opacity: .5; }
    .m-feliz { stroke-width: 2.3; }
    .m-sorrisao { stroke-width: 1.8; }
    .orelha { transform-box: fill-box; transform-origin: 50% 100%; }
    .p, .barra, .m-olho, .m-olhos { transform-box: fill-box; transform-origin: center; }
    .figura { transform-box: view-box; transform-origin: 200px 297px; }
    .codigo text { font-family: 'Syden Instrument Sans', 'Segoe UI', system-ui, sans-serif; font-size: 19px; font-weight: 600; fill: #E8EAF0; letter-spacing: 0.01em; }
    @keyframes piscar { 0%, 92%, 100% { transform: none; } 95% { transform: scaleY(.1); } }
    /* O OLHAR ANDA AOS SALTOS, como olho de verdade: pula em ~0,15 s, para, às vezes corrige um
       pouquinho, e nenhum ponto é o espelho do outro. O vai e vem suave anterior parecia máquina. */
    @keyframes olhar {
      0%, 12% { transform: none; }
      14%, 27% { transform: translate(-2.6px, .4px); }
      29%, 33% { transform: translate(-2px, .7px); }
      35%, 52% { transform: translate(2.1px, -.3px); }
      54%, 61% { transform: translate(2.7px, .5px); }
      63%, 71% { transform: translate(.6px, -.5px); }
      73%, 100% { transform: none; }
    }
    @keyframes ociosaE { 0%, 50%, 100% { transform: none; } 25%, 75% { transform: rotate(-2deg) scaleY(1.02); } }
    @keyframes ociosaD { 0%, 50%, 100% { transform: none; } 25% { transform: rotate(2deg) scaleY(1.02); } 82% { transform: rotate(14deg); } 87% { transform: rotate(-4deg); } 92% { transform: none; } }
    @keyframes boiar { 0%, 100% { transform: none; } 50% { transform: translateY(3px); } }
    .entrada { transform-box: view-box; transform-origin: 200px 230px; animation: abrir 0.80s cubic-bezier(.34,1.56,.64,1) both; }
    .orelha-e { animation: subir 0.60s cubic-bezier(.34,1.56,.64,1) 0.45s both, alegria 4.20s ease-in-out, ociosaE 6.40s ease-in-out 3.60s infinite; }
    .orelha-d { animation: subir 0.60s cubic-bezier(.34,1.56,.64,1) 0.55s both, alegria 4.20s ease-in-out, ociosaD 6.40s ease-in-out 3.60s infinite; }
    .m-olho { animation: abrirOlho 0.35s ease-out 1.00s both, piscar 4.20s ease-in-out 3.60s infinite; }
    .m-nariz, .m-boca { animation: aparecer 0.30s ease-out 1.30s both; }
    .m-bochechas { opacity: .5; animation: corar 0.50s ease-out 1.45s both; }
    .rosto-feliz { opacity: 0; animation: momentoFeliz 4.20s ease-in-out both; }
    .rosto-normal { animation: momentoNormal 4.20s ease-in-out both; }
    .m-olhos { animation: olhar 8.00s ease-in-out 3.60s infinite; }
    .figura { animation: pulinho 4.20s ease-in-out, boiar 3.60s ease-in-out 3.60s infinite; }
    @keyframes abrir { 0% { transform: scale(0); opacity: 0; } 100% { transform: none; opacity: 1; } }
    @keyframes subir { 0% { transform: scaleY(0); } 100% { transform: none; } }
    @keyframes abrirOlho { 0% { transform: scaleY(0); } 100% { transform: none; } }
    @keyframes aparecer { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes corar { 0% { opacity: 0; } 100% { opacity: .5; } }
    /* O momento feliz: de ~1,9 s a ~3,1 s. As bochechas ficam nas duas caras, então não piscam na troca. */
    @keyframes momentoFeliz { 0%, 44% { opacity: 0; } 48%, 72% { opacity: 1; } 77%, 100% { opacity: 0; } }
    @keyframes momentoNormal { 0%, 44% { opacity: 1; } 48%, 72% { opacity: 0; } 77%, 100% { opacity: 1; } }
    @keyframes alegria { 0%, 46% { transform: none; } 53% { transform: scaleY(1.1); } 60%, 100% { transform: none; } }
    @keyframes pulinho { 0%, 46% { transform: none; } 52% { transform: translateY(-8px); } 58% { transform: translateY(1px) scale(1.02, .98); } 63%, 100% { transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="figura"><g class="entrada">
    <g transform="translate(100 70) scale(2)">
      <g class="orelha orelha-e">
        <path class="o-fora" d="M31 55 C15 10, 35 -10, 42.5 5 C47.5 15, 42.5 40, 37.5 55 Z"/>
        <path class="o-dentro" d="M33 50 C21 15, 35 0, 40 10 C44 17.5, 40 37.5, 36.5 50 Z"/>
      </g>
      <g class="orelha orelha-d">
        <path class="o-fora" d="M69 55 C85 10, 65 -10, 57.5 5 C52.5 15, 57.5 40, 62.5 55 Z"/>
        <path class="o-dentro" d="M67 50 C79 15, 65 0, 60 10 C56 17.5, 60 37.5, 63.5 50 Z"/>
      </g>
      <path class="cabeca" d="M50 41.5 H50 A36 36 0 0 1 86 77.5 V77.5 A36 36 0 0 1 50 113.5 H50 L50 113.5 L50 113.5 H50 A36 36 0 0 1 14 77.5 V77.5 A36 36 0 0 1 50 41.5 Z"/>
      <g class="rosto-normal"><g class="rosto-m">
        <g class="m-bochechas"><ellipse cx="25.5" cy="82" rx="5.5" ry="3.2"/><ellipse cx="74.5" cy="82" rx="5.5" ry="3.2"/></g>
        <g class="m-olhos"><g class="m-olho m-olho-e"><circle class="m-pupila" cx="34" cy="72.5" r="4"/><circle class="m-brilho" cx="33" cy="71" r="1.25"/></g>
        <g class="m-olho m-olho-d"><circle class="m-pupila" cx="66" cy="72.5" r="4"/><circle class="m-brilho" cx="65" cy="71" r="1.25"/></g></g>
        <path class="m-nariz" d="M47 79 Q50 77 53 79 Q50 83 47 79 Z"/>
        <path class="m-boca" d="M45 84.5 Q50 89.5 55 84.5"/>
      </g></g>
      <g class="rosto-feliz"><g class="rosto-m">
        <g class="m-bochechas"><ellipse cx="25.5" cy="82" rx="5.5" ry="3.2"/><ellipse cx="74.5" cy="82" rx="5.5" ry="3.2"/></g>
        <g class="m-olhos"><path class="m-traco m-feliz" d="M29 72.5 Q34 67.5 39 72.5 M61 72.5 Q66 67.5 71 72.5"/></g>
        <path class="m-nariz" d="M47 79 Q50 77 53 79 Q50 83 47 79 Z"/>
        <path class="m-boca m-sorrisao" d="M43.5 84 Q50 91.5 56.5 84"/>
      </g></g>
    </g>
  </g></g>
</svg>
