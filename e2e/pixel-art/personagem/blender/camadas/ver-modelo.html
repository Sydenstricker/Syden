<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camadas em 3D</title>
<!-- Só de teste, fora do app: o GLB do piloto das camadas (pos.py põe o arquivo dentro desta página). -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #2b2c38; color: #e8e4ec; font: 14px system-ui, sans-serif; }
  #cena { width: 100vw; height: calc(100vh - 56px); display: block; }
  .barra { height: 56px; display: flex; gap: 8px; align-items: center; padding: 0 16px; flex-wrap: wrap; }
  button { background: #3d3f50; color: inherit; border: 1px solid #555870; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button[aria-pressed="true"] { background: #a8323a; border-color: #d0555c; }
  .sep { width: 1px; height: 24px; background: #555870; margin: 0 4px; }
</style>
</head>
<body>
<div class="barra">
  <span id="corpos"></span>
  <span class="sep"></span>
  <button data-ac="bone" aria-pressed="true">Boné</button>
  <button data-ac="bandana" aria-pressed="true">Bandana</button>
  <span class="sep"></span>
  <button data-anim="parado" aria-pressed="true">Parado</button>
  <button data-anim="andando" aria-pressed="false">Andando</button>
</div>
<canvas id="cena"></canvas>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const GLB = '__GLB_BASE64__';
const bin = Uint8Array.from(atob(GLB), c => c.charCodeAt(0)).buffer;

const canvas = document.getElementById('cena');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(devicePixelRatio);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2c38);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);
camera.position.set(9, 9, 22);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 4.2, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x554466, 1.6));
const sol = new THREE.DirectionalLight(0xffffff, 2.2);
sol.position.set(-6, 10, 8);
scene.add(sol);
const chao = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshStandardMaterial({ color: 0x3a3c4c }));
chao.rotation.x = -Math.PI / 2;
scene.add(chao);

const estado = { corpo: null, bone: true, bandana: true, anim: 'parado' };
let mixer, clips = [], raiz;

new GLTFLoader().parse(bin, '', (gltf) => {
  raiz = gltf.scene;
  scene.add(raiz);
  mixer = new THREE.AnimationMixer(raiz);
  clips = gltf.animations;
  // os corpos deste GLB: os nomes dos acessórios dizem quais são (acessorio-bone-<corpo>)
  const corpos = [];
  raiz.traverse((o) => { const m = o.name.match(/^acessorio-bone-(.+?)(_\d+)?$/); if (m && !corpos.includes(m[1])) corpos.push(m[1]); });
  const caixa = document.getElementById('corpos');
  corpos.forEach((c) => {
    const b = document.createElement('button');
    b.dataset.corpo = c; b.textContent = c;
    b.onclick = () => { estado.corpo = c; aplicar(); };
    caixa.appendChild(b);
  });
  estado.corpo = corpos[0];
  aplicar();
});

function aplicar() {
  if (!raiz) return;
  raiz.traverse((o) => {
    const m = o.name.match(/^acessorio-(bone|bandana)-(.+?)(_\d+)?$/);
    if (m) o.visible = estado[m[1]] && m[2] === estado.corpo;
  });
  // com o boné, a animação com as orelhas ajustadas (afastadas e deitadas o mínimo para não entrar nele), se houver
  const base = clips.find((c) => c.name === `${estado.anim}-${estado.corpo}`) ? `${estado.anim}-${estado.corpo}` : estado.anim;
  const clip = (estado.bone && clips.find((c) => c.name === `${base}-bone`)) || clips.find((c) => c.name === base);
  mixer.stopAllAction();
  if (clip) mixer.clipAction(clip).play();
  document.querySelectorAll('[data-corpo]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.corpo === estado.corpo));
  document.querySelectorAll('[data-ac]').forEach((b) => b.setAttribute('aria-pressed', estado[b.dataset.ac]));
  document.querySelectorAll('[data-anim]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.anim === estado.anim));
}

document.querySelectorAll('[data-ac]').forEach((b) => b.onclick = () => { estado[b.dataset.ac] = !estado[b.dataset.ac]; aplicar(); });
document.querySelectorAll('[data-anim]').forEach((b) => b.onclick = () => { estado.anim = b.dataset.anim; aplicar(); });

const relogio = new THREE.Clock();
function quadro() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * devicePixelRatio) || canvas.height !== Math.floor(h * devicePixelRatio)) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  if (mixer) mixer.update(relogio.getDelta());
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(quadro);
}
quadro();
</script>
</body>
</html>
